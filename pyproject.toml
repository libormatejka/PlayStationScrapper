[project]
name = "psn-sync"
version = "0.1.0"
description = "Daily sync of PlayStation Network game library and trophies into BigQuery"
requires-python = ">=3.10"
dependencies = [
    "psnawp>=3.0.3",
    "google-cloud-bigquery>=3.20",
    "google-cloud-secret-manager>=2.20",
]

[tool.setuptools.packages.find]
where = ["src"]
